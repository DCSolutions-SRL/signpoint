<meta charset="UTF-8">
<title>Firma Outlook</title>

<!-- Contenedor principal -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="max-width:400px; font-family:Arial, Helvetica, sans-serif; font-size:12pt; color:black;">
  <tbody>
    <tr>
      <!-- Columna izquierda: Datos + iconos -->
      <td valign="top" style="padding-right:10px;">
        <!-- Datos del usuario -->
        <div style="font-family:Arial, Helvetica, sans-serif; font-size:12pt; color:black;">
          <span><b>%%DisplayName%%</b></span><br>
          <span>%%Title%%</span><br>
          <span>%%Department%%</span><br>
          <span>%%PhoneNumber%%</span><br>
        </div>

        <!-- Iconos sociales -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:10px;">
          <tbody>
            <tr>
              <td style="padding-right:8px;">
                <a href="https://www.linkedin.com" target="_blank" rel="noopener noreferrer">
                  <img src="https://cdn-icons-png.freepik.com/512/174/174857.png" width="20" height="20" style="display:block; border:0;">
                </a>
              </td>
              <td style="padding-right:8px;">
                <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">
                  <img src="https://img.icons8.com/ios_filled/512/228BE6/youtube-play.png" width="20" height="20" style="display:block; border:0;">
                </a>
              </td>
              <td style="padding-right:8px;">
                <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">
                  <img src="https://png.pngtree.com/png-vector/20221018/ourmid/pngtree-instagram-social-flat-silhouette-icons-png-image_6315977.png" width="20" height="20" style="display:block; border:0;">
                </a>
              </td>
              <td style="padding-right:8px;">
                <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer">
                  <img src="https://cdn-icons-png.flaticon.com/512/20/20673.png" width="20" height="20" style="display:block; border:0;">
                </a>
              </td>
              <td style="padding-right:8px;">
                <a href="https://www.google.com/maps/place/City+Center+Rosario/" target="_blank" rel="noopener noreferrer">
                  <img src="https://png.pngtree.com/png-vector/20240929/ourmid/pngtree-3d-location-icon-clipart-in-transparent-background-png-image_13983760.png" width="20" height="20" style="display:block; border:0;">
                </a>
              </td>
              <td>
                <a href="https://www.citycenteronline.bet.ar/" target="_blank" rel="noopener noreferrer">
                  <img src="https://pngimg.com/uploads/phone/phone_PNG48972.png" width="20" height="20" style="display:block; border:0;">
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </td>

      <!-- Columna derecha: Logos -->
      <td valign="top" style="vertical-align:middle;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="font-family:Arial, Helvetica, sans-serif; font-size:12pt; color:black;">
          <tbody>
            <tr>
              <td style="padding-right:12px; vertical-align:middle;">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTO8HG7GfnjHTXiY3JLmtr1Pu6PW6JhRMpfCg&s" height="60" style="display:block; border:0; margin-left:10px;">
              </td>
              <td style="vertical-align:middle;">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTMkZrSAar2BXgf5o_qE_kC-Bg1rPYzvsSehw&s" height="40" style="display:block; border:0;">
              </td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
  </tbody>
</table>
